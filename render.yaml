services:
  - type: web
    name: elion-hub-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations marketplace && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: elion-hub-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://elion-marketplace.github.io
databases:
  - name: elion-hub-db
    databaseName: elionhub
    user: elionhub
